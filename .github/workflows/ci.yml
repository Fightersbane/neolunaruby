name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Unit tests are hardware-free by design: audio and GPU layers are
      # monkeypatched, heavy deps import lazily. No torch/models needed here.
      - name: Install test dependencies
        run: pip install pytest numpy soundfile
      - name: Byte-compile all sources
        run: python -m compileall -q app engine bot.py scripts
      - name: Run tests
        run: python -m pytest -q
